<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevFix – coding errors, explained</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef2ef;--ink:#14211c;--mut:#5a6b64;--card:#fff;--line:#d3ddd7;--acc:#0f6b4a;--accfg:#fff;--code:#16201c;--codefg:#d8f3e4;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--ink:#e6f0ea;--mut:#92a69c;--card:#17221e;--line:#2a3a33;--acc:#3ecf8e;--accfg:#0c1a14;--code:#0a110e;--warn:#f0a35a}}
:root[data-theme="dark"]{--bg:#101815;--ink:#e6f0ea;--mut:#92a69c;--card:#17221e;--line:#2a3a33;--acc:#3ecf8e;--accfg:#0c1a14;--code:#0a110e;--warn:#f0a35a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 18px 56px}
h1{font-size:2.4rem;line-height:1.1;margin:0 0 6px;font-weight:600;letter-spacing:-.02em}
h1 span{font-family:"JetBrains Mono",monospace;font-weight:500;color:var(--acc)}
.sub{color:var(--mut);margin:0 0 26px;max-width:56ch}
label{display:block;font-weight:500;margin:0 0 6px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
textarea{font-family:"JetBrains Mono",monospace;font-size:.92rem;min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.row>div{flex:1 1 200px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--acc);padding:11px 18px}
.go{background:var(--acc);color:var(--accfg)}
.ghost{background:transparent;color:var(--acc)}
.ex{margin:10px 0 0;color:var(--mut);font-size:.9rem}
.ex button{padding:3px 9px;margin:3px 4px 0 0;font-weight:400;font-size:.85rem;font-family:"JetBrains Mono",monospace}
#out{margin-top:30px}
.sec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:14px 18px;margin:0 0 14px}
.sec.why{border-left-color:var(--warn)}
.sec h2{font-size:1.05rem;margin:0 0 4px}
.sec p{margin:0}
pre{background:var(--code);color:var(--codefg);border-radius:6px;padding:14px;overflow-x:auto;font:.88rem/1.5 "JetBrains Mono",monospace;margin:10px 0 0}
.tag{font-family:"JetBrains Mono",monospace;font-size:.85rem;color:var(--mut);margin:0 0 12px}
.empty{color:var(--mut);border:1px dashed var(--line);border-radius:6px;padding:18px}
</style>
</head>
<body>
<main>
<h1>Dev<span>Fix</span></h1>
<p class="sub">Paste an error message, pick your language, and get a plain-English explanation with a fix.</p>

<label for="err">Error message</label>
<textarea id="err" placeholder="TypeError: Cannot read properties of undefined"></textarea>
<p class="ex">Try:
<button class="ghost" data-e="TypeError: Cannot read properties of undefined (reading 'name')" data-l="JavaScript">undefined property</button>
<button class="ghost" data-e="IndexError: list index out of range" data-l="Python">list index</button>
<button class="ghost" data-e="java.lang.NullPointerException" data-l="Java">NullPointerException</button>
<button class="ghost" data-e="Segmentation fault (core dumped)" data-l="C++">segfault</button>
</p>

<div class="row">
<div><label for="lang">Programming language</label>
<select id="lang"><option>JavaScript</option><option>Python</option><option>Java</option><option>C++</option><option>Other</option></select></div>
</div>
<button class="go" id="go">Explain this error</button>

<div id="out" aria-live="polite"><div class="empty">Your explanation will show up here.</div></div>
</main>

<script>
// Each rule: language ("*" = any), regex on the error text, and the three answers.
const RULES=[
{l:"JavaScript",re:/cannot read propert(y|ies) of (undefined|null)/i,
 what:"You tried to read a property (like user.name) on a value that is undefined or null.",
 why:"The object was never assigned, an API or array lookup returned nothing, or you used the variable before the data arrived (e.g. before an async call finished).",
 fix:"Check the object exists before using it, or use optional chaining. Also find out why it is undefined in the first place.",
 code:"// before\nconsole.log(user.name);\n\n// after\nconsole.log(user?.name);            // optional chaining\nif (user) { console.log(user.name); }"},
{l:"JavaScript",re:/(\w+) is not defined/i,
 what:"JavaScript found a variable name it has never heard of (ReferenceError).",
 why:"Typo in the name, the variable is declared in a different scope, or a file/library was not imported.",
 fix:"Declare the variable with let/const before using it, fix the spelling, or add the missing import.",
 code:"const total = 5;\nconsole.log(total); // not 'totl'"},
{l:"JavaScript",re:/is not a function/i,
 what:"You called something as a function, but the value is not a function.",
 why:"Wrong method name, the value is undefined/an object, or an import returned something different than expected.",
 fix:"Log the value with typeof and check the spelling and import.",
 code:"console.log(typeof myFn);   // should be 'function'"},
{l:"JavaScript",re:/unexpected token|syntaxerror/i,
 what:"The code has a syntax mistake the parser cannot read.",
 why:"A missing bracket, quote or comma, or JSON that is not valid.",
 fix:"Look at the line in the message and the line above it for unclosed ( { [ or quotes. For JSON, validate it first.",
 code:"JSON.parse('{\"a\": 1}');  // keys and strings need double quotes"},
{l:"Python",re:/list index out of range/i,
 what:"You asked for a list position that does not exist.",
 why:"The list is shorter than you expected, is empty, or the loop goes one step too far (indexes start at 0).",
 fix:"Check len(list) before indexing, or loop directly over the items.",
 code:"if i < len(items):\n    print(items[i])\n\nfor item in items:\n    print(item)"},
{l:"Python",re:/indentationerror/i,
 what:"Python found lines that are not indented consistently.",
 why:"Mixed tabs and spaces, or a block (if/for/def) with no indented body.",
 fix:"Use 4 spaces everywhere and indent the body of every block.",
 code:"def greet():\n    print('hi')   # 4 spaces"},
{l:"Python",re:/nameerror/i,
 what:"You used a name Python does not know yet.",
 why:"Typo, used before it was defined, or a missing import.",
 fix:"Define the variable first, fix the spelling, or import the module.",
 code:"import math\nprint(math.sqrt(16))"},
{l:"Python",re:/modulenotfounderror|no module named/i,
 what:"Python cannot find the package you tried to import.",
 why:"It is not installed in the environment you are running, or the name is misspelled.",
 fix:"Install it with pip in the same environment, then run again.",
 code:"pip install requests"},
{l:"Python",re:/keyerror/i,
 what:"You looked up a dictionary key that is not there.",
 why:"The key is misspelled, has different case, or was never added.",
 fix:"Use .get() with a default or check with 'in'.",
 code:"value = data.get('name', 'unknown')"},
{l:"Python",re:/typeerror.*(nonetype|not subscriptable)|'nonetype'/i,
 what:"You used a None value as if it were a real object.",
 why:"A function returned None (often because it has no return statement).",
 fix:"Make sure the function returns a value, and check for None before using it.",
 code:"result = compute()\nif result is not None:\n    print(result[0])"},
{l:"Java",re:/nullpointerexception/i,
 what:"You used an object reference that points to nothing (null).",
 why:"The object was never created with new, a method returned null, or a field was not initialised.",
 fix:"Initialise the object, and check for null before calling methods on it.",
 code:"String s = getName();\nif (s != null) {\n    System.out.println(s.length());\n}"},
{l:"Java",re:/arrayindexoutofbounds/i,
 what:"You accessed an array position that does not exist.",
 why:"Valid indexes are 0 to length-1; loops using <= length go one too far.",
 fix:"Loop with i < arr.length.",
 code:"for (int i = 0; i < arr.length; i++) { ... }"},
{l:"Java",re:/cannot find symbol/i,
 what:"The compiler does not recognise a variable, method or class name.",
 why:"Typo, missing import, or the variable is declared in another scope.",
 fix:"Check spelling and capitalisation, declare the variable, or add the import.",
 code:"import java.util.ArrayList;"},
{l:"C++",re:/segmentation fault|sigsegv/i,
 what:"Your program touched memory it is not allowed to access.",
 why:"Dereferencing a null or dangling pointer, indexing past the end of an array, or very deep recursion.",
 fix:"Initialise pointers, check bounds, and run with -g plus a debugger or -fsanitize=address to find the line.",
 code:"g++ -g -fsanitize=address main.cpp\nif (ptr != nullptr) { *ptr = 5; }"},
{l:"C++",re:/undefined reference/i,
 what:"The linker found a function that was declared but never defined.",
 why:"A .cpp file is missing from the build, or a library is not linked.",
 fix:"Compile all source files together and add -l flags for libraries.",
 code:"g++ main.cpp helper.cpp -o app"},
{l:"*",re:/stack overflow|maximum recursion|too much recursion/i,
 what:"A function kept calling itself until the call stack ran out of space.",
 why:"The recursion has no base case, or never reaches it.",
 fix:"Add a base case that stops the recursion, or use a loop.",
 code:"def f(n):\n    if n == 0:   # base case\n        return 0\n    return f(n - 1)"},
{l:"*",re:/permission denied|eacces/i,
 what:"The system blocked access to a file or port.",
 why:"Your user does not have rights on that path, or another program is using it.",
 fix:"Check the path and permissions, and avoid privileged ports like 80.",
 code:"chmod u+rw yourfile"},
{l:"*",re:/(no such file|cannot find|enoent|filenotfound)/i,
 what:"The program could not find the file or folder you named.",
 why:"Wrong path, wrong working directory, or a typo in the filename.",
 fix:"Print the current directory and use the correct relative or absolute path.",
 code:"// Python: import os; print(os.getcwd())"}
];

const GENERIC={
 what:"This error is not in DevFix's built-in list, so here is how to read it yourself.",
 why:"Most errors name a type (like TypeError or SyntaxError), a short reason, and a file and line number. The line number is usually where the problem shows up, not always where it starts.",
 fix:"Open the file and line from the message and check the line above it too. Re-read the error type, search for its exact text with your language name, and reproduce it with the smallest possible code.",
 code:"// Tip: copy the first line of the error + language into a search engine"};

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function explain(){
  const text=$("err").value.trim(), lang=$("lang").value, out=$("out");
  if(!text){out.innerHTML='<div class="empty">Paste an error message first, then press Explain this error.</div>';$("err").focus();return}
  const hit=RULES.find(r=>r.re.test(text)&&(r.l===lang||r.l==="*"||lang==="Other"))
        ||RULES.find(r=>r.re.test(text));
  const r=hit||GENERIC;
  const note=hit&&lang!=="Other"&&hit.l!=="*"&&hit.l!==lang?`<p class="tag">This looks like a ${hit.l} error, so the answer is for ${hit.l}.</p>`:"";
  out.innerHTML=note+
   `<div class="sec"><h2>What happened?</h2><p>${esc(r.what)}</p></div>
    <div class="sec why"><h2>Why might it happen?</h2><p>${esc(r.why)}</p></div>
    <div class="sec"><h2>How can I fix it?</h2><p>${esc(r.fix)}</p><pre>${esc(r.code)}</pre></div>`;
}
$("go").addEventListener("click",explain);
document.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>{
  $("err").value=b.dataset.e;$("lang").value=b.dataset.l;explain();
}));
</script>
</body>
</html>
